[project]
name = "iam-paths"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
